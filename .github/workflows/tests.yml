# Runs the package's EditMode and PlayMode suites on every push and pull request.
#
# Unity in CI needs an activated licence, which cannot be committed. Until these repository secrets
# exist the test job skips rather than fails, so an unconfigured repo shows a grey skip on main and
# not a red X, and a pull request from a fork - which GitHub deliberately withholds secrets from,
# however the repo is configured - does the same instead of failing on someone else's contribution.
#
# Add them under Settings -> Secrets and variables -> Actions:
#
#   UNITY_LICENSE   contents of the .ulf file from a Personal licence activation
#   UNITY_EMAIL     the Unity account address
#   UNITY_PASSWORD  that account's password
#
# See https://game.ci/docs/github/activation for how to produce UNITY_LICENSE.
#
# The EditMode suite includes UI tests that construct real EditorWindows, so the container must NOT
# run with -nographics: without a graphics device every EditorWindowUITestFixture fails at once in
# OneTimeSetUp. game-ci's editor images ship a virtual display, which is why this works headless.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job-level `if` cannot read the secrets context - GitHub allows only github, needs, vars and
  # inputs there - so the presence of the licence has to be turned into an output by a step, which
  # can read it. This is the whole reason for a second job.
  activation:
    name: licence configured?
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        run: |
          echo "available=${{ secrets.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.UNITY_LICENSE != '' }}" != "true" ]; then
            echo "::notice::UNITY_LICENSE is not set, so the test jobs are skipped. See the comment at the top of this workflow."
          fi

  test:
    name: ${{ matrix.testMode }}
    needs: activation
    if: needs.activation.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.10f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
