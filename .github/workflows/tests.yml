# Runs the package's EditMode and PlayMode suites on every push and pull request.
#
# Unity in CI needs an activated licence, which cannot be committed. Until these repository secrets
# exist the test job skips rather than fails, so an unconfigured repo shows a grey skip on main and
# not a red X, and a pull request from a fork - which GitHub deliberately withholds secrets from,
# however the repo is configured - does the same instead of failing on someone else's contribution.
#
# Add them under Settings -> Secrets and variables -> Actions:
#
#   UNITY_LICENSE   the entire contents of Unity_lic.ulf
#   UNITY_EMAIL     the Unity account address
#   UNITY_PASSWORD  that account's password
#
# All three are required, not just the licence: a personal licence activates against the account
# as well as the file, and reusing the .ulf from a local Unity activation is the documented
# path - it is tied to neither a Unity version nor a platform.
# See https://game.ci/docs/github/activation.
#
# If the editmode job fails with "No graphic device is available to initialize the view", roughly
# thirty tests going red together in OneTimeSetUp, the container has no display. Every
# EditorWindowUITestFixture in this package builds a real EditorWindow and needs one; the same
# failure is reproducible locally by adding -nographics. game-ci's editor images are expected to
# provide a virtual display, but their docs do not say so outright, so treat that signature as the
# first thing to check rather than as something already ruled out.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job-level `if` cannot read the secrets context - GitHub allows only github, needs, vars and
  # inputs there - so the presence of the licence has to be turned into an output by a step, which
  # can read it. This is the whole reason for a second job.
  activation:
    name: licence configured?
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          # All three, not just the licence. A personal licence activates against the account as well
          # as the .ulf, so a licence-only setup gets past a check for the licence and then fails
          # inside the editor container - which is the red X this gate exists to prevent.
          if [ "$HAS_LICENSE$HAS_EMAIL$HAS_PASSWORD" = "truetruetrue" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the tests. UNITY_LICENSE=$HAS_LICENSE UNITY_EMAIL=$HAS_EMAIL UNITY_PASSWORD=$HAS_PASSWORD - all three are required for a personal licence."
          fi

  test:
    name: ${{ matrix.testMode }}
    needs: activation
    if: needs.activation.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.10f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
